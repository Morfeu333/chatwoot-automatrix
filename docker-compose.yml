version: '3'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env
    volumes:
      - ./storage:/app/storage
      # Override: routes Instagram comments to n8n (Chatwoot drops them natively)
      - ./overrides/app/jobs/webhooks/instagram_events_job.rb:/app/app/jobs/webhooks/instagram_events_job.rb
      # Override: fixes Instagram OAuth authorize URL (api.instagram.com → www.instagram.com)
      - ./overrides/app/controllers/concerns/instagram_concern.rb:/app/app/controllers/concerns/instagram_concern.rb
    depends_on:
      - postgres
      - redis

  rails:
    <<: *base
    container_name: chatwoot-rails
    restart: unless-stopped
    ports:
      - "3200:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: bundle exec rails s -p 3000 -b 0.0.0.0

  sidekiq:
    <<: *base
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: bundle exec sidekiq -C config/sidekiq.yml

  postgres:
    container_name: chatwoot-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    container_name: chatwoot-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis:/data
